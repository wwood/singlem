name: Build and deploy documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
      - name: Regenerate CLI reference
        run: pixi run -e docs --frozen generate-docs-reference
      - name: Check generated CLI reference
        run: git diff --exit-code -- docs/reference
      - name: Build Zensical site
        run: pixi run -e docs --frozen zensical build --clean
      - name: Add legacy URL redirects
        run: pixi run -e docs --frozen python bin/add_docs_redirects.py
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
