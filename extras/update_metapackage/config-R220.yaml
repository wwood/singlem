# Whole representative genome assemblies (untarred gtdb_genomes_reps_r220.tar.gz),
# used to build the bundled weebill two-stage database. Required. File names must
# carry the GCA_/GCF_ accession, as GTDB's do, since that is how weebill's genomes
# are matched back to taxonomy.
gtdb_genome_reps: /work/microbiome/db/gtdb/gtdb_release220/genomic_files_reps/gtdb_genomes_reps_r220
# This directory holds each of its 113104 genomes twice, as both .fna and .fna.gz,
# so restrict the glob to the compressed copy -- the default extension list would
# otherwise sketch every genome twice.
weebill_genome_extensions:
  - "*.fna.gz"
# -c the weebill database is built at, and so also the -c reads are sketched at.
weebill_c: 100
gtdb_bac_tax: /work/microbiome/db/gtdb/gtdb_release220/bac120_taxonomy_r220.tsv
gtdb_arc_tax: /work/microbiome/db/gtdb/gtdb_release220/ar53_taxonomy_r220.tsv
pfams: /work/microbiome/msingle/sam/HMMs/Pfam
tigrfams: /work/microbiome/msingle/sam/HMMs/TIGRfams.HMM
uniprot_seq: /work/microbiome/abisko/aroneys/uniprot/uniref100_20210616/uniprot_sprot.fa
uniprot_tax: /work/microbiome/abisko/aroneys/uniprot/uniref100_20210616/uniprot_sprot_taxonomy.tsv
sra_seqs_1:
  DRR083195: /work/microbiome/msingle/sam/SRA/DRR083195_1.fastq
  SRR1926147: /work/microbiome/msingle/sam/SRA/SRR1926147_1.fastq
  SRR9224014: /work/microbiome/msingle/sam/SRA/SRR9224014_1.fastq
sra_seqs_2:
  DRR083195: /work/microbiome/msingle/sam/SRA/DRR083195_2.fastq
  SRR1926147: /work/microbiome/msingle/sam/SRA/SRR1926147_2.fastq
  SRR9224014: /work/microbiome/msingle/sam/SRA/SRR9224014_2.fastq
gtdb_bac_metadata: /work/microbiome/db/gtdb/gtdb_release220/bac120_metadata_r220.tsv
gtdb_arc_metadata: /work/microbiome/db/gtdb/gtdb_release220/ar53_metadata_r220.tsv
checkm2_output_dirs: /work/microbiome/msingle/mess/172_checkm2_r220/output/checkm2
